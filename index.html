<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direcciones DIA VERDE</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#18351f;
}

header{
    background:#176b37;
    color:white;
    padding:22px;
}

h1{
    margin:0;
    font-size:25px;
}

.sub{
    margin-top:6px;
    font-size:14px;
    opacity:.9;
}

main{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 2px 8px #0001;
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select{
    width:100%;
    min-height:48px;
    border:1px solid #cbd8ce;
    border-radius:9px;
    padding:10px;
    font-size:16px;
    background:white;
    cursor:pointer;
}

.info{
    margin-top:10px;
    color:#657267;
    font-size:13px;
}

button{
    margin-top:12px;
    border:0;
    background:#e8f2eb;
    color:#176b37;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#dcebe1;
}

#map{
    height:430px;
    border-radius:12px;
    margin-top:14px;
}

.result h2{
    margin:0 0 4px;
}

.count{
    color:#657267;
    font-size:13px;
    margin-bottom:14px;
}

.list{
    display:grid;
    gap:9px;
}

.address{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border:1px solid #e0e8e1;
    border-radius:10px;
}

.address strong{
    font-size:15px;
}

.address small{
    display:block;
    color:#657267;
    margin-top:4px;
}

.maps{
    background:#176b37;
    color:white;
    text-decoration:none;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.maps:hover{
    background:#0f5129;
}

.empty,
.loading{
    text-align:center;
    color:#657267;
    padding:35px;
}

.error{
    background:#ffe9e9;
    color:#9b2020;
    padding:15px;
    border-radius:10px;
}

@media(max-width:600px){

    .address{
        flex-direction:column;
        align-items:stretch;
    }

    .maps{
        text-align:center;
    }

    #map{
        height:360px;
    }

}

</style>

</head>


<body>


<header>

<h1>
📍 Direcciones DIA VERDE
</h1>

<div class="sub">
Seleccioná una zona para ver su mapa y sus direcciones
</div>

</header>



<main>


<!-- =====================================================
     SELECTOR
     ===================================================== -->

<section class="card">

<label for="zone">
Seleccionar zona
</label>


<select id="zone">

<option value="">
— Elegí una zona —
</option>

</select>


<div class="info">

El mapa corresponde al polígono de la zona.
Las direcciones se actualizan desde Google Sheets.

</div>


<button id="refresh">

🔄 Actualizar ahora

</button>

</section>



<!-- =====================================================
     MAPA
     ===================================================== -->

<section class="card">

<h2 id="title">
Mapa de la zona
</h2>


<div id="map"></div>

</section>



<!-- =====================================================
     DIRECCIONES
     ===================================================== -->

<section class="card result">

<h2 id="resultTitle">
Direcciones
</h2>


<div class="count" id="count">

Seleccioná una zona para comenzar.

</div>


<div class="list" id="list">

<div class="empty">

Elegí una zona del menú.

</div>

</div>

</section>


</main>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

const SHEET_ID =
"1ysCEVN9PljeIcIFxvBsoxL9iXOdWbVTjm4mn8GcPkK8";

const GID =
"1911460821";


/* =====================================================
   VARIABLES
   ===================================================== */

let data=[];

let zonasGeo=[];

let selectedZone="";

let activeLayer=null;


/* =====================================================
   ELEMENTOS
   ===================================================== */

const zone =
document.getElementById("zone");

const title =
document.getElementById("title");

const resultTitle =
document.getElementById("resultTitle");

const count =
document.getElementById("count");

const list =
document.getElementById("list");

const refresh =
document.getElementById("refresh");


/* =====================================================
   MAPA
   ===================================================== */

const map =
L.map("map").setView(
    [-34.7777,-58.3809],
    13
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:
        "&copy; OpenStreetMap contributors"
    }
).addTo(map);



/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function esc(text){

    return String(text ?? "")
    .replace(/[&<>"']/g,function(m){

        return {

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m];

    });

}



/* =====================================================
   NORMALIZAR
   ===================================================== */

function normalizar(texto){

    return String(texto ?? "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}



/* =====================================================
   MAPA GEOJSON
   ===================================================== */

function cargarMapa(){

    fetch(
        "zonas.geojson?t="+Date.now()
    )

    .then(response=>{

        if(!response.ok){

            throw new Error(
                "No se pudo cargar zonas.geojson"
            );

        }

        return response.json();

    })

    .then(geojson=>{

        zonasGeo =
        geojson.features || [];


        /*
         El selector utiliza los nombres
         EXACTOS del KMZ.
        */

        zone.innerHTML =
        '<option value="">' +
        '— Elegí una zona —' +
        '</option>';


        zonasGeo.forEach(feature=>{

            const option =
            document.createElement("option");


            option.value =
            feature.properties.name;


            option.textContent =
            feature.properties.name;


            zone.appendChild(option);

        });

    })

    .catch(error=>{

        console.error(error);

        document.getElementById("map").innerHTML =

        '<div class="error">' +

        'No se pudo cargar el mapa de zonas.' +

        '<br><br>' +

        esc(error.message) +

        '</div>';

    });

}



/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

function cargarDatos(){

    list.innerHTML =
    '<div class="loading">' +
    'Cargando direcciones...' +
    '</div>';


    const callback =
    "handleSheets_"+Date.now();


    window[callback] =
    function(response){

        try{

            const rows =

            (response.table.rows || [])
            .map(row =>

                (row.c || [])
                .map(cell =>

                    cell &&
                    cell.v != null

                    ?

                    String(cell.v)

                    :

                    ""

                )

            );


            data=[];


            /*
             Llavallol
             A = Calle
             B = N°
             C = Zona
            */

            rows.forEach(row=>{

                agregar(
                    row,
                    0,
                    1,
                    2,
                    "Llavallol"
                );


                /*
                 Banfield
                 D = Calle
                 E = N°
                 F = Zona
                */

                agregar(
                    row,
                    3,
                    4,
                    5,
                    "Banfield"
                );


                /*
                 Temperley
                 G = Calle
                 H = N°
                 I = Zona
                */

                agregar(
                    row,
                    6,
                    7,
                    8,
                    "Temperley"
                );


                /*
                 Turdera
                 J = Calle
                 K = N°
                 SIN ZONA
                */

                agregar(
                    row,
                    9,
                    10,
                    null,
                    "Turdera"
                );


                /*
                 Lomas
                 L = Calle
                 M = N°
                 N = Zona
                */

                agregar(
                    row,
                    11,
                    12,
                    13,
                    "Lomas"
                );

            });


            /*
             Si había una zona seleccionada,
             volver a mostrarla.
            */

            if(selectedZone){

                render();

            }

            else{

                list.innerHTML =
                '<div class="empty">' +
                'Elegí una zona del menú.' +
                '</div>';

            }

        }

        catch(error){

            console.error(error);

            list.innerHTML =

            '<div class="error">' +

            '<strong>' +

            'Error al cargar las direcciones' +

            '</strong>' +

            '<br><br>' +

            esc(error.message) +

            '</div>';

        }


        finally{

            delete window[callback];


            const script =
            document.getElementById(callback);


            if(script){

                script.remove();

            }

        }

    };


    const script =
    document.createElement("script");


    script.id =
    callback;


    script.src =

    "https://docs.google.com/spreadsheets/d/" +

    SHEET_ID +

    "/gviz/tq" +

    "?tqx=responseHandler:" +

    callback +

    "&gid=" +

    GID +

    "&t=" +

    Date.now();


    script.onerror =
    function(){

        list.innerHTML =

        '<div class="error">' +

        '<strong>' +

        'No se pudo conectar con Google Sheets.' +

        '</strong>' +

        '</div>';


        delete window[callback];

        script.remove();

    };


    document.body.appendChild(script);

}



/* =====================================================
   AGREGAR DIRECCIÓN
   ===================================================== */

function agregar(

    row,

    calleCol,

    numeroCol,

    zonaCol,

    localidad

){

    const calle =

    (

        row[calleCol] ||

        ""

    ).trim();


    const numero =

    (

        row[numeroCol] ||

        ""

    ).trim();


    /*
     Ignorar filas vacías.
    */

    if(

        !calle &&
        !numero

    ){

        return;

    }


    let zona="";


    if(zonaCol !== null){

        zona =

        (

            row[zonaCol] ||

            ""

        ).trim();

    }


    /*
     TURDERA ES UNA SOLA ZONA
    */

    if(

        normalizar(localidad)
        ===
        "turdera"

    ){

        zona="Turdera";

    }


    data.push({

        localidad:
        localidad,

        calle:
        calle,

        numero:
        numero,

        zona:
        zona

    });

}



/* =====================================================
   EQUIVALENCIAS KMZ ↔ GOOGLE SHEETS
   ===================================================== */

function equivalenciaZona(nombreKMZ){

    const n =
    normalizar(nombreKMZ);


    /*
     ==================================================
     LAVALLOL
     ==================================================
    */

    if(
        n === "lavallol norte"
    ){

        return {

            localidad:"Llavallol",

            zona:"Norte"

        };

    }


    if(
        n === "lavallol sur"
    ){

        return {

            localidad:"Llavallol",

            zona:"Sur"

        };

    }


    /*
     ==================================================
     BANFIELD
     ==================================================
    */

    if(
        n === "banfield este"
    ){

        return {

            localidad:"Banfield",

            zona:"Este"

        };

    }


    if(
        n === "banfield oeste"
    ){

        return {

            localidad:"Banfield",

            zona:"Oeste"

        };

    }


    /*
     Banfied 3
     */

    if(
        n === "banfield 3"
        ||
        n === "banfield 3"
    ){

        return {

            localidad:"Banfield",

            zona:"Banfield 3"

        };

    }


    /*
     ==================================================
     TEMPERLEY
     ==================================================
    */

    if(
        n === "temperley este cerrito"
    ){

        return {

            localidad:"Temperley",

            zona:"Este Cerrito"

        };

    }


    if(
        n ===
        "temperley este 30 de septiembre"
    ){

        return {

            localidad:"Temperley",

            zona:"Este 30 de Septiembre"

        };

    }


    if(
        n === "temperley oeste"
    ){

        return {

            localidad:"Temperley",

            zona:"Oeste"

        };

    }


    /*
     ==================================================
     TURDERA
     ==================================================
    */

    if(
        n === "turdera"
    ){

        return {

            localidad:"Turdera",

            zona:"Turdera"

        };

    }


    /*
     ==================================================
     LOMAS
     ==================================================
    */

    if(
        n === "lomas este"
    ){

        return {

            localidad:"Lomas",

            zona:"Este"

        };

    }


    if(
        n === "lomas - microcentro"
    ){

        return {

            localidad:"Lomas",

            zona:"Microcentro"

        };

    }


    if(
        n === "lomas - frias/garibaldi"
        ||
        n === "lomas - frias/garibaldi"
    ){

        return {

            localidad:"Lomas",

            zona:"Frias/Garibaldi"

        };

    }


    if(
        n === "lomas - p libertad"
    ){

        return {

            localidad:"Lomas",

            zona:"P Libertad"

        };

    }


    if(
        n === "lomas - las heras"
    ){

        return {

            localidad:"Lomas",

            zona:"Las Heras"

        };

    }


    /*
     Si no encuentra equivalencia,
     usa el nombre original.
    */

    return null;

}



/* =====================================================
   COMPARAR DIRECCIÓN CON ZONA
   ===================================================== */

function coincideZona(

    item,

    nombreKMZ

){

    const eq =
    equivalenciaZona(
        nombreKMZ
    );


    /*
     TURDERA
    */

    if(

        normalizar(nombreKMZ)
        ===
        "turdera"

    ){

        return (

            normalizar(item.localidad)
            ===
            "turdera"

        );

    }


    /*
     Si existe equivalencia
    */

    if(eq){

        return (

            normalizar(
                item.localidad
            )

            ===

            normalizar(
                eq.localidad
            )

            &&

            normalizar(
                item.zona
            )

            ===

            normalizar(
                eq.zona
            )

        );

    }


    return false;

}



/* =====================================================
   MOSTRAR MAPA
   ===================================================== */

function mostrarMapa(nombre){

    /*
     Quitar polígono anterior.
    */

    if(activeLayer){

        map.removeLayer(
            activeLayer
        );

        activeLayer=null;

    }


    /*
     Buscar polígono.
    */

    const feature =
    zonasGeo.find(

        f =>

        f.properties.name
        ===
        nombre

    );


    if(!feature){

        return;

    }


    /*
     Crear polígono.
    */

    activeLayer =

    L.geoJSON(

        feature,

        {

            style:{

                weight:3,

                fillOpacity:.25

            }

        }

    ).addTo(map);


    /*
     Zoom automático.
    */

    const bounds =
    activeLayer.getBounds();


    if(bounds.isValid()){

        map.fitBounds(

            bounds,

            {

                padding:[
                    25,
                    25
                ]

            }

        );

    }


    title.textContent =
    "🗺️ "+nombre;

}



/* =====================================================
   MOSTRAR DIRECCIONES
   ===================================================== */

function render(){

    selectedZone =
    zone.value;


    /*
     Sin selección.
    */

    if(!selectedZone){

        resultTitle.textContent =
        "Direcciones";


        count.textContent =
        "Seleccioná una zona para comenzar.";


        list.innerHTML =
        '<div class="empty">' +

        'Elegí una zona del menú.' +

        '</div>';


        if(activeLayer){

            map.removeLayer(
                activeLayer
            );

            activeLayer=null;

        }


        title.textContent =
        "Mapa de la zona";


        return;

    }


    /*
     Mostrar mapa.
    */

    mostrarMapa(
        selectedZone
    );


    /*
     Filtrar direcciones
     según equivalencia.
    */

    const direcciones =

    data.filter(

        item =>

        coincideZona(
            item,
            selectedZone
        )

    );


    /*
     Título.
    */

    resultTitle.textContent =
    selectedZone;


    /*
     Cantidad.
    */

    count.textContent =

    direcciones.length

    +

    (

        direcciones.length === 1

        ?

        " dirección"

        :

        " direcciones"

    );


    /*
     Sin direcciones.
    */

    if(!direcciones.length){

        list.innerHTML =

        '<div class="empty">' +

        'No hay direcciones cargadas para esta zona.' +

        '</div>';

        return;

    }


    /*
     Crear lista.
    */

    list.innerHTML =

    direcciones.map(

        item => {


            /*
             Google Maps:

             SOLO
             Calle + Número + Localidad

             No usamos la zona.
             No usamos referencias.
            */

            const direccion =

            `${item.calle} ${item.numero}, ` +

            `${item.localidad}, ` +

            `Buenos Aires, Argentina`;


            const mapsURL =

            "https://www.google.com/maps/search/?api=1&query="

            +

            encodeURIComponent(
                direccion
            );


            return `

            <div class="address">

                <div>

                    <strong>

                        ${esc(item.calle)}

                        ${

                            item.numero

                            ?

                            " " +
                            esc(item.numero)

                            :

                            ""

                        }

                    </strong>


                    <small>

                        ${esc(
                            item.localidad
                        )}

                    </small>

                </div>


                <a

                    class="maps"

                    href="${mapsURL}"

                    target="_blank"

                    rel="noopener noreferrer"

                >

                    📍 Abrir Maps

                </a>

            </div>

            `;

        }

    ).join("");

}



/* =====================================================
   EVENTOS
   ===================================================== */

zone.addEventListener(

    "change",

    render

);


refresh.addEventListener(

    "click",

    cargarDatos

);



/* =====================================================
   INICIO
   ===================================================== */

cargarMapa();

cargarDatos();



/* =====================================================
   ACTUALIZACIÓN AUTOMÁTICA
   ===================================================== */

setInterval(

    cargarDatos,

    5 * 60 * 1000

);

</script>


</body>

</html>
