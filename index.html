<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direcciones DIA VERDE</title>


<style>

/* =====================================================
   ESTILO GENERAL
   ===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#18351f;
}


/* =====================================================
   ENCABEZADO
   ===================================================== */

header{
    background:#176b37;
    color:white;
    padding:22px;
}

h1{
    margin:0;
    font-size:25px;
}

.sub{
    margin-top:6px;
    font-size:14px;
    opacity:.9;
}


/* =====================================================
   CONTENIDO
   ===================================================== */

main{
    max-width:1000px;
    margin:auto;
    padding:20px;
}


/* =====================================================
   SELECTOR
   ===================================================== */

.selector{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 2px 8px #0001;
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select{
    width:100%;
    min-height:48px;

    border:1px solid #cbd8ce;

    border-radius:9px;

    padding:10px;

    font-size:16px;

    background:white;

    cursor:pointer;
}

.info{
    margin-top:10px;
    color:#657267;
    font-size:13px;
}


/* =====================================================
   RESULTADOS
   ===================================================== */

.result{
    background:white;

    border-radius:14px;

    padding:18px;

    box-shadow:0 2px 8px #0001;
}

.result h2{
    margin:0 0 4px;
}

.count{
    color:#657267;

    font-size:13px;

    margin-bottom:14px;
}


/* =====================================================
   LISTA
   ===================================================== */

.list{
    display:grid;

    gap:9px;
}


/* =====================================================
   DIRECCIÓN
   ===================================================== */

.address{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:12px;

    border:1px solid #e0e8e1;

    border-radius:10px;

    background:white;

}


.address strong{

    font-size:15px;

}


.address small{

    display:block;

    color:#657267;

    margin-top:4px;

}


/* =====================================================
   BOTÓN GOOGLE MAPS
   ===================================================== */

.maps{

    background:#176b37;

    color:white;

    text-decoration:none;

    padding:9px 12px;

    border-radius:8px;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

    transition:.2s;

}


.maps:hover{

    background:#0f5129;

}


/* =====================================================
   MENSAJES
   ===================================================== */

.empty{

    text-align:center;

    color:#657267;

    padding:35px;

}


.loading{

    text-align:center;

    color:#657267;

    padding:35px;

}


.error{

    background:#ffe9e9;

    color:#9b2020;

    padding:15px;

    border-radius:10px;

}


/* =====================================================
   MÓVIL
   ===================================================== */

@media(max-width:600px){

    .address{

        flex-direction:column;

        align-items:stretch;

    }


    .maps{

        text-align:center;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     ENCABEZADO
     ===================================================== -->

<header>

<h1>
📍 Direcciones DIA VERDE
</h1>


<div class="sub">

Seleccioná una zona para ver sus direcciones

</div>

</header>



<main>


<!-- =====================================================
     SELECTOR DE ZONA
     ===================================================== -->

<section class="selector">


<label for="zone">

Seleccionar zona

</label>


<select id="zone">

<option value="">

— Elegí una zona —

</option>

</select>


<div class="info">

Datos actualizados directamente desde Google Sheets.

</div>


</section>



<!-- =====================================================
     RESULTADOS
     ===================================================== -->

<section class="result">


<h2 id="title">

Direcciones

</h2>


<div class="count" id="count">

Seleccioná una zona para comenzar.

</div>


<div class="list" id="list">


<div class="loading">

Cargando direcciones...

</div>


</div>


</section>


</main>



<script>


/* =====================================================
   GOOGLE SHEETS
   =====================================================

   Hoja:
   Direcciones Día Verde CGM

   Publicada como CSV
   ===================================================== */


const CSV_URL =

"https://docs.google.com/spreadsheets/d/e/2PACX-1vStXdzYe3QQ0ACSu1Z4p3TnJta1MxqXC152zL0fAvDc85N_mW0_61lE5gLgrmNFZNNdLdEi184w6E7A/pub?gid=1911460821&single=true&output=csv";



/* =====================================================
   VARIABLES
   ===================================================== */

let data=[];



/* =====================================================
   ELEMENTOS HTML
   ===================================================== */

const zone =

document.getElementById("zone");


const title =

document.getElementById("title");


const count =

document.getElementById("count");


const list =

document.getElementById("list");



/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function esc(text){

    return String(text ?? "")

        .replace(/[&<>\"']/g,function(m){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                "\"":"&quot;",

                "'":"&#039;"

            }[m];

        });

}



/* =====================================================
   NORMALIZAR TEXTO
   ===================================================== */

function normalizar(texto){

    return String(texto ?? "")

        .trim()

        .toLowerCase();

}



/* =====================================================
   PARSER CSV
   ===================================================== */

function parseCSV(text){

    const rows=[];


    let row=[];

    let value="";

    let insideQuotes=false;



    for(

        let i=0;

        i<text.length;

        i++

    ){

        const char=text[i];

        const next=text[i+1];



        /*
         Comillas dobles dentro de un campo
        */

        if(

            char === '"'

            &&

            insideQuotes

            &&

            next === '"'

        ){

            value += '"';

            i++;

            continue;

        }



        /*
         Inicio / fin de comillas
        */

        if(char === '"'){

            insideQuotes=!insideQuotes;

            continue;

        }



        /*
         Separador de columna
        */

        if(

            char === ","

            &&

            !insideQuotes

        ){

            row.push(value);

            value="";

            continue;

        }



        /*
         Fin de fila
        */

        if(

            (

                char === "\n"

                ||

                char === "\r"

            )

            &&

            !insideQuotes

        ){

            if(

                char === "\r"

                &&

                next === "\n"

            ){

                i++;

            }



            row.push(value);

            value="";



            if(

                row.some(

                    x =>

                    x.trim() !== ""

                )

            ){

                rows.push(row);

            }



            row=[];

            continue;

        }



        value += char;

    }



    /*
     Última fila
    */

    if(

        value !== ""

        ||

        row.length

    ){

        row.push(value);

        rows.push(row);

    }



    return rows;

}



/* =====================================================
   CARGAR GOOGLE SHEETS
   ===================================================== */

async function cargarDatos(){


    try{


        /*
         Mostrar cargando
        */

        list.innerHTML =

        '<div class="loading">' +

        'Cargando direcciones...' +

        '</div>';



        /*
         Descargar CSV

         Se agrega timestamp para evitar
         que el navegador utilice caché.
        */

        const response =

        await fetch(

            CSV_URL +

            "&t=" +

            Date.now()

        );



        /*
         Comprobar respuesta
        */

        if(!response.ok){

            throw new Error(

                "No se pudo acceder a Google Sheets."

            );

        }



        /*
         Leer CSV
        */

        const csv =

        await response.text();



        /*
         Convertir CSV
         */

        const rows =

        parseCSV(csv);



        /*
         Comprobar datos
        */

        if(rows.length < 3){

            throw new Error(

                "La planilla no contiene suficientes datos."

            );

        }



        /*
         Vaciar datos anteriores
        */

        data=[];



        /*
         ==============================================
         LLAVALLOL
         A = Calle
         B = Número
         C = Zona
         ==============================================
        */

        procesarBloque(

            rows,

            0,

            1,

            2,

            "Llavallol"

        );



        /*
         ==============================================
         BANFIELD
         D = Calle
         E = Número
         F = Zona
         ==============================================
        */

        procesarBloque(

            rows,

            3,

            4,

            5,

            "Banfield"

        );



        /*
         ==============================================
         TEMPERLEY
         G = Calle
         H = Número
         I = Zona
         ==============================================
        */

        procesarBloque(

            rows,

            6,

            7,

            8,

            "Temperley"

        );



        /*
         ==============================================
         TURDERA
         J = Calle
         K = Número

         NO EXISTE ZONA

         Turdera = una sola zona
         ==============================================
        */

        procesarBloque(

            rows,

            9,

            10,

            null,

            "Turdera"

        );



        /*
         ==============================================
         LOMAS
         L = Calle
         M = Número
         N = Zona
         ==============================================
        */

        procesarBloque(

            rows,

            11,

            12,

            13,

            "Lomas"

        );



        /*
         Crear selector
        */

        crearZonas();



        /*
         Mensaje inicial
        */

        list.innerHTML =

        '<div class="empty">' +

        'Elegí una zona del menú.' +

        '</div>';


    }


    catch(error){


        console.error(error);



        list.innerHTML =

        '<div class="error">' +

        '<strong>Error al cargar las direcciones</strong>' +

        '<br><br>' +

        esc(error.message) +

        '<br><br>' +

        'Verificá que Google Sheets esté publicado en la web.' +

        '</div>';

    }

}



/* =====================================================
   PROCESAR BLOQUE DE LOCALIDAD
   ===================================================== */

function procesarBloque(

    rows,

    calleCol,

    numeroCol,

    zonaCol,

    localidad

){


    /*
     La fila 1 contiene la localidad.

     La fila 2 contiene:

     Calle | N° | Zona

     Los datos empiezan en la fila 3.

     En JavaScript:

     fila 3 = índice 2
    */


    for(

        let i=2;

        i<rows.length;

        i++

    ){


        const row =

        rows[i] || [];



        /*
         Obtener calle
        */

        const calle =

        (

            row[calleCol] ||

            ""

        ).trim();



        /*
         Obtener número
        */

        const numero =

        (

            row[numeroCol] ||

            ""

        ).trim();



        /*
         Obtener zona
        */

        let zona = "";



        if(zonaCol !== null){

            zona =

            (

                row[zonaCol] ||

                ""

            ).trim();

        }



        /*
         Si no existe calle
         ni número, ignorar fila.
        */

        if(

            !calle

            &&

            !numero

        ){

            continue;

        }



        /*
         TURDERA

         Siempre una sola zona.
        */

        if(

            normalizar(localidad)

            ===

            "turdera"

        ){

            zona="Turdera";

        }



        /*
         Guardar dirección
        */

        data.push({

            localidad:localidad,

            calle:calle,

            numero:numero,

            zona:zona

        });

    }

}



/* =====================================================
   CREAR LISTA DE ZONAS
   ===================================================== */

function crearZonas(){


    const zonas =

    new Set();



    /*
     Recorrer direcciones
    */

    data.forEach(item=>{


        /*
         TURDERA

         Una única opción.
        */

        if(

            normalizar(item.localidad)

            ===

            "turdera"

        ){

            zonas.add(

                "Turdera"

            );



            return;

        }



        /*
         Otras localidades

         Localidad — Zona
        */

        if(item.zona){

            zonas.add(

                item.localidad

                +

                " — "

                +

                item.zona

            );

        }


        else{

            zonas.add(

                item.localidad

            );

        }

    });



    /*
     Ordenar zonas
    */

    const lista =

    Array.from(zonas)

    .sort(

        (a,b)=>

        a.localeCompare(

            b,

            "es"

        )

    );



    /*
     Limpiar selector
    */

    zone.innerHTML =

    '<option value="">' +

    '— Elegí una zona —' +

    '</option>';



    /*
     Crear opciones
    */

    lista.forEach(z=>{


        const option =

        document.createElement(

            "option"

        );



        option.value=z;

        option.textContent=z;



        zone.appendChild(

            option

        );

    });

}



/* =====================================================
   MOSTRAR DIRECCIONES
   ===================================================== */

function render(){


    const selected =

    zone.value;



    /*
     Si no seleccionó zona
    */

    if(!selected){


        title.textContent=

        "Direcciones";



        count.textContent=

        "Seleccioná una zona para comenzar.";



        list.innerHTML=

        '<div class="empty">' +

        'Elegí una zona del menú.' +

        '</div>';



        return;

    }



    /*
     Filtrar direcciones
    */

    const direcciones =

    data.filter(item=>{


        /*
         TURDERA
        */

        if(

            normalizar(item.localidad)

            ===

            "turdera"

        ){

            return(

                selected

                ===

                "Turdera"

            );

        }



        /*
         Resto de localidades
        */

        return(

            selected

            ===

            item.localidad

            +

            " — "

            +

            item.zona

        );

    });



    /*
     Título
    */

    title.textContent=

    selected;



    /*
     Cantidad
    */

    count.textContent=

    direcciones.length

    +

    (

        direcciones.length === 1

        ?

        " dirección"

        :

        " direcciones"

    );



    /*
     Sin resultados
    */

    if(!direcciones.length){


        list.innerHTML=

        '<div class="empty">' +

        'No hay direcciones cargadas para esta zona.' +

        '</div>';


        return;

    }



    /*
     Crear lista
    */

    list.innerHTML=

    direcciones

    .map(item=>{


        /*
         Dirección que se enviará a Maps.

         IMPORTANTE:

         No usamos la columna Zona
         como parte de la dirección.

         Tampoco usamos calles de referencia.

         Solo:

         CALLE + NÚMERO + LOCALIDAD
        */

        const direccion =

        item.calle

        +

        " "

        +

        item.numero

        +

        ", "

        +

        item.localidad

        +

        ", Buenos Aires, Argentina";



        /*
         Link Google Maps
        */

        const mapsURL =

        "https://www.google.com/maps/search/?api=1&query="

        +

        encodeURIComponent(

            direccion

        );



        /*
         HTML de dirección
        */

        return `

        <div class="address">

            <div>

                <strong>

                    ${esc(item.calle)}

                    ${

                        item.numero

                        ?

                        " " +

                        esc(item.numero)

                        :

                        ""

                    }

                </strong>


                <small>

                    ${esc(item.localidad)}

                </small>

            </div>


            <a

                class="maps"

                href="${mapsURL}"

                target="_blank"

                rel="noopener noreferrer"

            >

                📍 Abrir Maps

            </a>

        </div>

        `;


    })

    .join("");

}



/* =====================================================
   EVENTO DEL SELECTOR
   ===================================================== */

zone.addEventListener(

    "change",

    render

);



/* =====================================================
   CARGA INICIAL
   ===================================================== */

cargarDatos();



/* =====================================================
   ACTUALIZACIÓN AUTOMÁTICA
   =====================================================

   Cada 5 minutos vuelve a consultar
   Google Sheets.

   No hay que modificar GitHub
   cuando cambian las direcciones.
   ===================================================== */

setInterval(

    cargarDatos,

    5 * 60 * 1000

);


</script>


</body>

</html>
