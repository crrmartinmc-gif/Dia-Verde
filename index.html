<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direcciones DIA VERDE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#18351f;
}

header{
    background:#176b37;
    color:white;
    padding:22px;
}

h1{
    margin:0;
    font-size:25px;
}

.sub{
    margin-top:6px;
    font-size:14px;
    opacity:.9;
}

main{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.selector,
.result{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 2px 8px #0001;
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select{
    width:100%;
    min-height:48px;
    border:1px solid #cbd8ce;
    border-radius:9px;
    padding:10px;
    font-size:16px;
    background:white;
    cursor:pointer;
}

.info{
    margin-top:10px;
    color:#657267;
    font-size:13px;
}

.refresh{
    margin-top:12px;
    border:0;
    background:#e8f2eb;
    color:#176b37;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.refresh:hover{
    background:#dcebe1;
}

.result h2{
    margin:0 0 4px;
}

.count{
    color:#657267;
    font-size:13px;
    margin-bottom:14px;
}

.list{
    display:grid;
    gap:9px;
}

.address{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border:1px solid #e0e8e1;
    border-radius:10px;
    background:white;
}

.address strong{
    font-size:15px;
}

.address small{
    display:block;
    color:#657267;
    margin-top:4px;
}

.maps{
    background:#176b37;
    color:white;
    text-decoration:none;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.maps:hover{
    background:#0f5129;
}

.empty,
.loading{
    text-align:center;
    color:#657267;
    padding:35px;
}

.error{
    background:#ffe9e9;
    color:#9b2020;
    padding:15px;
    border-radius:10px;
}

@media(max-width:600px){

    .address{
        flex-direction:column;
        align-items:stretch;
    }

    .maps{
        text-align:center;
    }

}

</style>

</head>


<body>


<header>

<h1>📍 Direcciones DIA VERDE</h1>

<div class="sub">
Seleccioná una zona para ver sus direcciones
</div>

</header>


<main>


<section class="selector">

<label for="zone">
Seleccionar zona
</label>

<select id="zone">

<option value="">
— Elegí una zona —
</option>

</select>

<div class="info">
Datos actualizados directamente desde Google Sheets.
</div>

<button
    class="refresh"
    id="refresh"
>
🔄 Actualizar ahora
</button>

</section>


<section class="result">

<h2 id="title">
Direcciones
</h2>

<div class="count" id="count">
Seleccioná una zona para comenzar.
</div>

<div class="list" id="list">

<div class="loading">
Cargando direcciones...
</div>

</div>

</section>


</main>


<script>

/* =====================================================
   GOOGLE SHEETS
   ===================================================== */

const SHEET_ID =
"1ysCEVN9PljeIcIFxvBsoxL9iXOdWbVTjm4mn8GcPkK8";

const GID =
"1911460821";


/* =====================================================
   VARIABLES
   ===================================================== */

let data = [];

let selectedZone = "";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const zone =
document.getElementById("zone");

const title =
document.getElementById("title");

const count =
document.getElementById("count");

const list =
document.getElementById("list");

const refresh =
document.getElementById("refresh");


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function esc(text){

    return String(text ?? "")
    .replace(/[&<>"']/g,function(m){

        return {

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[m];

    });

}


/* =====================================================
   NORMALIZAR
   ===================================================== */

function normalizar(texto){

    return String(texto ?? "")
    .trim()
    .toLowerCase();

}


/* =====================================================
   CARGAR GOOGLE SHEETS
   ===================================================== */

function cargarDatos(){

    list.innerHTML =
    '<div class="loading">' +
    'Cargando direcciones...' +
    '</div>';


    const callback =
    "handleGoogleSheets_" +
    Date.now();


    /*
       Google Visualization
       permite consultar la planilla
       sin utilizar fetch/CORS.
    */

    window[callback] =
    function(response){

        try{

            if(
                !response ||
                !response.table ||
                !response.table.rows
            ){

                throw new Error(
                    "Google Sheets no devolvió datos."
                );

            }


            data = [];


            /*
               Convertimos las filas
               de Google Visualization
               en arrays normales.
            */

            const rows =
            response.table.rows.map(

                row =>

                (row.c || []).map(

                    cell =>

                    cell &&
                    cell.v != null

                    ?

                    String(cell.v)

                    :

                    ""

                )

            );


            /*
               ==================================================
               BLOQUES DE LA PLANILLA
               ==================================================

               A-C = Llavallol
               D-F = Banfield
               G-I = Temperley
               J-K = Turdera
               L-N = Lomas
            */


            rows.forEach(row => {


                agregar(

                    row,

                    0,
                    1,
                    2,

                    "Llavallol"

                );


                agregar(

                    row,

                    3,
                    4,
                    5,

                    "Banfield"

                );


                agregar(

                    row,

                    6,
                    7,
                    8,

                    "Temperley"

                );


                agregar(

                    row,

                    9,
                    10,
                    null,

                    "Turdera"

                );


                agregar(

                    row,

                    11,
                    12,
                    13,

                    "Lomas"

                );

            });


            /*
               Crear zonas
            */

            crearZonas();


            /*
               Mantener zona seleccionada
               después de actualizar.
            */

            if(

                selectedZone &&

                [...zone.options]
                .some(

                    option =>
                    option.value === selectedZone

                )

            ){

                zone.value =
                selectedZone;

                render();

            }

            else{

                zone.value = "";

                selectedZone = "";

                title.textContent =
                "Direcciones";

                count.textContent =
                "Seleccioná una zona para comenzar.";

                list.innerHTML =
                '<div class="empty">' +
                'Elegí una zona del menú.' +
                '</div>';

            }


        }

        catch(error){

            console.error(error);


            list.innerHTML =

            '<div class="error">' +

            '<strong>' +

            'Error al cargar las direcciones' +

            '</strong>' +

            '<br><br>' +

            esc(error.message) +

            '</div>';

        }


        finally{

            delete window[callback];


            const script =
            document.getElementById(callback);


            if(script){

                script.remove();

            }

        }

    };


    /*
       Crear script JSONP
    */

    const script =
    document.createElement("script");


    script.id =
    callback;


    script.src =

    "https://docs.google.com/spreadsheets/d/" +

    SHEET_ID +

    "/gviz/tq" +

    "?tqx=responseHandler:" +

    callback +

    "&gid=" +

    GID +

    "&t=" +

    Date.now();


    script.onerror =
    function(){

        list.innerHTML =

        '<div class="error">' +

        '<strong>' +

        'No se pudo conectar con Google Sheets.' +

        '</strong>' +

        '<br><br>' +

        'Verificá que la planilla esté publicada en la web.' +

        '</div>';


        delete window[callback];


        script.remove();

    };


    document.body.appendChild(script);

}


/* =====================================================
   AGREGAR DIRECCIÓN
   ===================================================== */

function agregar(

    row,

    calleCol,

    numeroCol,

    zonaCol,

    localidad

){

    const calle =

    (

        row[calleCol] || ""

    ).trim();


    const numero =

    (

        row[numeroCol] || ""

    ).trim();


    /*
       Si no hay calle ni número,
       no es una dirección.
    */

    if(

        !calle &&
        !numero

    ){

        return;

    }


    let zona = "";


    /*
       Obtener zona
       para localidades
       que tienen columna Zona.
    */

    if(zonaCol !== null){

        zona =

        (

            row[zonaCol] || ""

        ).trim();

    }


    /*
       TURDERA

       Siempre una única zona.
    */

    if(

        normalizar(localidad)
        ===
        "turdera"

    ){

        zona =
        "Turdera";

    }


    /*
       Guardar dirección
    */

    data.push({

        localidad:
        localidad,

        calle:
        calle,

        numero:
        numero,

        zona:
        zona

    });

}


/* =====================================================
   CREAR ZONAS
   ===================================================== */

function crearZonas(){

    const zonas =
    new Set();


    data.forEach(item => {


        /*
           TURDERA

           Una sola zona.
        */

        if(

            normalizar(item.localidad)
            ===
            "turdera"

        ){

            zonas.add(
                "Turdera"
            );

            return;

        }


        /*
           Localidades con zonas.
        */

        if(item.zona){

            zonas.add(

                item.localidad
                +
                " — "
                +
                item.zona

            );

        }

        else{

            zonas.add(
                item.localidad
            );

        }

    });


    /*
       Orden alfabético
    */

    const lista =

    [...zonas].sort(

        (a,b) =>

        a.localeCompare(
            b,
            "es"
        )

    );


    /*
       Reiniciar selector
    */

    zone.innerHTML =

    '<option value="">' +

    '— Elegí una zona —' +

    '</option>';


    /*
       Agregar opciones
    */

    lista.forEach(z => {


        const option =
        document.createElement(
            "option"
        );


        option.value =
        z;


        option.textContent =
        z;


        zone.appendChild(
            option
        );

    });

}


/* =====================================================
   MOSTRAR DIRECCIONES
   ===================================================== */

function render(){

    selectedZone =
    zone.value;


    /*
       Sin selección
    */

    if(!selectedZone){

        title.textContent =
        "Direcciones";


        count.textContent =
        "Seleccioná una zona para comenzar.";


        list.innerHTML =

        '<div class="empty">' +

        'Elegí una zona del menú.' +

        '</div>';


        return;

    }


    /*
       Filtrar
    */

    const direcciones =

    data.filter(item => {


        /*
           TURDERA
        */

        if(

            normalizar(item.localidad)
            ===
            "turdera"

        ){

            return (

                selectedZone
                ===
                "Turdera"

            );

        }


        /*
           Otras localidades
        */

        return (

            selectedZone

            ===

            item.localidad
            +
            " — "
            +
            item.zona

        );

    });


    /*
       Título
    */

    title.textContent =
    selectedZone;


    /*
       Cantidad
    */

    count.textContent =

    direcciones.length +

    (

        direcciones.length === 1

        ?

        " dirección"

        :

        " direcciones"

    );


    /*
       Sin resultados
    */

    if(!direcciones.length){

        list.innerHTML =

        '<div class="empty">' +

        'No hay direcciones cargadas para esta zona.' +

        '</div>';

        return;

    }


    /*
       Crear direcciones
    */

    list.innerHTML =

    direcciones.map(

        item => {


            /*
               IMPORTANTE:

               Google Maps recibe solamente:

               CALLE
               NÚMERO
               LOCALIDAD

               NO recibe la zona
               ni calles de referencia.
            */

            const direccion =

            `${item.calle} ${item.numero}, ` +

            `${item.localidad}, ` +

            `Buenos Aires, Argentina`;


            /*
               Link Google Maps
            */

            const mapsURL =

            "https://www.google.com/maps/search/?api=1&query="

            +

            encodeURIComponent(
                direccion
            );


            return `

            <div class="address">

                <div>

                    <strong>

                        ${esc(item.calle)}

                        ${
                            item.numero
                            ?
                            " " +
                            esc(item.numero)
                            :
                            ""
                        }

                    </strong>


                    <small>

                        ${esc(item.localidad)}

                    </small>

                </div>


                <a

                    class="maps"

                    href="${mapsURL}"

                    target="_blank"

                    rel="noopener noreferrer"

                >

                    📍 Abrir Maps

                </a>

            </div>

            `;

        }

    ).join("");

}


/* =====================================================
   EVENTOS
   ===================================================== */

zone.addEventListener(

    "change",

    render

);


refresh.addEventListener(

    "click",

    cargarDatos

);


/* =====================================================
   CARGA INICIAL
   ===================================================== */

cargarDatos();


/* =====================================================
   ACTUALIZACIÓN AUTOMÁTICA

   Cada 5 minutos.
   ===================================================== */

setInterval(

    cargarDatos,

    5 * 60 * 1000

);

</script>


</body>

</html>
